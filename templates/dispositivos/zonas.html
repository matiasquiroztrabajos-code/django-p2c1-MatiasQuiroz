{% extends "base.html" %}

{% block title %}
    Zonas | EcoEnergy
{% endblock %}

{% block content %}
    <h1 class="mb-4">
        <i class="bi bi-geo-alt-fill text-success"></i> Zonas de consumo
    </h1>

    {% if zonas %}
        <div class="row g-4">
            {% for zona in zonas %}
                <div class="col-md-4">
                    <div class="card h-100 shadow-sm">
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title">{{ zona.nombre }}</h5>
                            <a
                                href="{% url 'dispositivos:detalle_zona' zona.id %}"
                                class="btn btn-eco btn-sm mt-auto">
                                Ver detalle
                            </a>
                        </div>
                    </div>
                </div>
            {% endfor %}
        </div>
    {% else %}
        <div class="alert alert-warning" role="alert">
            <i class="bi bi-exclamation-triangle-fill"></i> No hay zonas disponibles.
        </div>
    {% endif %}
{% endblock %}
